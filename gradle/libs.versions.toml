[versions]
agp = "9.5.0"
kotlin = "2.4.21"
activityCompose = "1.13.0"
browser = "1.10.0"
coilCompose = "2.7.0"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
datastorePreferences = "1.3.0"
kotlinxSerializationJson = "1.12.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
loggingInterceptor = "5.5.1"
material3 = "1.5.0-beta02"
